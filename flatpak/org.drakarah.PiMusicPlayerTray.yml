app-id: org.drakarah.PiMusicPlayerTray
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: pimusicplayertray

finish-args:
  # Show the popup window and let WebKitGTK render it. The app prefers X11
  # (XWayland on Wayland sessions) so it can place the popup in the screen
  # corner, and pynput's hotkey fallback needs X11 too. Don't add
  # --socket=fallback-x11: on Wayland it takes precedence and hides X11.
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  # Audio output for the player's <audio> playback (WebKit/GStreamer uses
  # PulseAudio, which PipeWire also provides).
  - --socket=pulseaudio
  # The player web page is normally served from localhost by MusicPlayerV2.
  - --share=network
  # Read the user's config from the host's ~/.config/pimusicplayertray
  # (the sandbox otherwise only sees ~/.var/app/<app-id>/config).
  - --filesystem=xdg-config/pimusicplayertray:ro
  # AppIndicator registers itself as a StatusNotifierItem on the session bus.
  # Flatpak's finish-args validation rejects wildcarded D-Bus names, so we
  # grant the concrete names the app will use: inside its own sandboxed pid
  # namespace the app is always pid 2, so the resulting bus name is always
  # org.kde.StatusNotifierItem-2-<n>. A couple of trailing indices are
  # granted in case the item has to be re-registered (e.g. after a bus name
  # conflict) and the registration counter is bumped.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --own-name=org.kde.StatusNotifierItem-2-2

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - python3-pynput.json

  - name: pimusicplayertray
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/bin/pimusicplayertray
      - install -Dm644 config.ini /app/share/pimusicplayertray/config.ini
      - install -Dm644 playericon_2.png /app/share/pimusicplayertray/playericon_2.png
      - install -Dm644 playericon_2.png /app/share/icons/hicolor/128x128/apps/org.drakarah.PiMusicPlayerTray.png
      - install -Dm644 org.drakarah.PiMusicPlayerTray.desktop /app/share/applications/org.drakarah.PiMusicPlayerTray.desktop
      - install -Dm644 org.drakarah.PiMusicPlayerTray.metainfo.xml /app/share/metainfo/org.drakarah.PiMusicPlayerTray.metainfo.xml
    sources:
      - type: dir
        path: ../PiMusicPlayerTray-linux
      - type: file
        path: org.drakarah.PiMusicPlayerTray.desktop
      - type: file
        path: org.drakarah.PiMusicPlayerTray.metainfo.xml
